          p_w_setpoint: {address: 27768, format: float32, access: rw, unit: W, eng_per_count: 1.0}
          p_poi: {address: 26128, format: float32, access: r, unit: W, eng_per_count: 1.0}
          p_battery: {address: 26128, format: float32, access: r, unit: W, eng_per_count: 1.0}
          q_u_setpoint: {address: 27758, format: float32, access: rw, unit: var, eng_per_count: 1.0}
          q_v_setpoint: {address: 27760, format: float32, access: rw, unit: var, eng_per_count: 1.0}
          q_w_setpoint: {address: 27762, format: float32, access: rw, unit: var, eng_per_count: 1.0}
          q_poi: {address: 26136, format: float32, access: r, unit: var, eng_per_count: 1.0} 
          q_battery: {address: 26136, format: float32, access: r, unit: var, eng_per_count: 1.0}
          v_poi: {address: 26102, format: float32, access: r, unit: V, eng_per_count: 1.732}
          enable: {address: 17002, format: uint32, access: rw, unit: raw, eng_per_count: 1.0}
          #soc: {address: 22, format: uint16, access: r, unit: pu, eng_per_count: 0.0001} 
          start_command: {address: 17000, format: uint32, access: rw, unit: raw, eng_per_count: 1.0}
          trigger: {address: 17020, format: uint32, access: rw, unit: raw, eng_per_count: 1.0}
    measurement_series:
      soc: 5
